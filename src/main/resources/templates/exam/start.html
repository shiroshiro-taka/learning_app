<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="${exam?.examName} + ' - 試験開始'">模擬試験</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            'primary-blue': '#1c55c8', 'primary-blue-hover': '#1747a5',
            'success-green': '#10b981', 'error-red': '#ef4444',
            'accent-yellow': '#facc15', 'dark-panel': '#2d3748',
        }}}}
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #f3f4f6; }
        body { display: flex; flex-direction: column; }
        header { height: 50px; flex-shrink: 0; }
        main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 20px; }
        footer { flex-shrink: 0; z-index: 50; }
        .preserve-format { white-space: pre-wrap; word-break: break-all; }
        #status-scroll-area { max-height: 44px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; }
        .q-status-btn { width: 32px; height: 32px; flex-shrink: 0; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: white; background-color: #4b5563; cursor: pointer; }
        .status-current { background-color: #facc15 !important; color: #1f2937 !important; border: 2px solid #1f2937; }
        .status-answered { background-color: #10b981 !important; }
        .status-review::after { content: "📌"; position: absolute; top: -4px; right: -4px; font-size: 10px; }
        .choice-item { transition: all 0.1s ease; border: 2px solid #e5e7eb; }
        .selected-choice { background-color: #eff6ff; border-color: #3b82f6 !important; }
        .hljs { font-size: 13px; border-radius: 8px; }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<header class="bg-white border-b flex items-center justify-between px-4 shadow-sm">
    <div class="flex items-center space-x-2 truncate">
        <span class="text-blue-600 font-bold text-sm">Exam:</span>
        <h1 class="text-sm font-bold text-gray-800 truncate" th:text="${exam.examName}">模擬試験</h1>
    </div>
    <div class="flex items-center bg-red-50 px-2 py-1 rounded border border-red-100">
        <span id="timer" class="text-red-600 font-mono font-bold text-sm">--:--</span>
    </div>
</header>

<main class="p-3">
    <div id="question-container" class="max-w-3xl mx-auto">
        <div th:each="q, iterStat : ${examQuestions}" 
             class="question-block bg-white rounded-xl shadow-sm border p-4 mb-4 hidden" 
             th:id="'q-'+${q.question.id}" th:data-index="${iterStat.index}">
            <div class="flex items-start mb-3">
                <span class="text-lg font-black text-blue-700 mr-2" th:text="'問' + ${iterStat.count}"></span>
                <div class="text-sm font-bold text-gray-800 preserve-format" th:utext="${q.question.questionText}"></div>
            </div>
            <div class="space-y-2">
                <div th:each="c : ${q.question.choices}" 
                     class="choice-item p-3 rounded-lg cursor-pointer"
                     th:onclick="'selectChoice(' + ${q.question.id} + ',' + ${c.id} + ')'"
                     th:id="'choice-box-' + ${c.id}">
                    <label th:utext="${c.choiceText}"></label>
                </div>
            </div>
            <div class="mt-4 pt-3 border-t"><input type="checkbox" th:id="'review-' + ${q.question.id}" class="review-check"> 後で見直す</div>
        </div>
    </div>
</main>

<footer class="bg-dark-panel text-white">
    <div id="status-scroll-area"></div>
    <div class="flex justify-between p-2">
        <button id="prev" class="bg-gray-700 p-2 rounded">◀</button>
        <button id="next" class="bg-primary-blue p-2 rounded">次へ</button>
        <button onclick="confirmFinish()" class="bg-error-red p-2 rounded">終了</button>
    </div>
</footer>

<script th:inline="javascript">
/*<![CDATA[*/
let questionsCount = /*[[${examQuestions.size()}]]*/ 0;
let questionsData = [];
/*[# th:each="q, iterStat : ${examQuestions}"]*/
questionsData.push({ id: /*[[${q.question.id}]]*/ 0, index: /*[[${iterStat.index}]]*/ 0 });
/*[/]*/

function showQuestion(index) {
    try {
        index = parseInt(index);
        if (index < 0 || index >= questionsCount) return;
        $('.question-block').addClass('hidden');
        let target = $('.question-block').eq(index);
        if(target.length) target.removeClass('hidden');
        
        if (window.MathJax) MathJax.typesetPromise();
        $('#prev').prop('disabled', index === 0);
        $('#next').prop('disabled', index === questionsCount - 1);
        $('main').scrollTop(0);
    } catch (e) { console.error("表示エラー:", e); }
}

$(document).ready(function() {
    // ステータスボタン生成を安全に実行
    let area = $('#status-scroll-area');
    questionsData.forEach((q, i) => {
        area.append(`<div class="q-status-btn" id="status-btn-${i}" onclick="showQuestion(${i})">${i+1}</div>`);
    });
    
    $('#prev').click(() => showQuestion(parseInt($('.question-block:not(.hidden)').data('index')) - 1));
    $('#next').click(() => showQuestion(parseInt($('.question-block:not(.hidden)').data('index')) + 1));
    
    showQuestion(0);
    if(typeof hljs !== 'undefined') hljs.highlightAll();
});

function confirmFinish() { if (confirm("終了しますか？")) $('#finishForm').submit(); }
/*]]>*/
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</body>
</html>
