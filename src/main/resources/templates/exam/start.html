<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${exam?.examName} + ' - 試験開始'">模擬試験</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    'primary-blue': '#1c55c8',
                    'primary-blue-hover': '#1747a5',
                    'success-green': '#10b981',
                    'error-red': '#ef4444',
                    'accent-yellow': '#facc15',
                    'dark-panel': '#2d3748',
                },
                fontFamily: {
                    sans: ['Inter', 'sans-serif'],
                },
            }
        }
    }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
<style>
  body { 
    display: flex;
    flex-direction: column; 
    height: 100vh; 
    overflow: hidden; /* 全体のスクロールを禁止し、内部エリアで制御 */
  }
  
  .preserve-format {
    white-space: pre-wrap;
  }

  .hljs {
      padding: 0.75em;
      background: #f3f3f3;
      border-radius: 0.5rem;
      line-height: 1.4;
      overflow-x: auto;
  }

  .selected { 
      background-color: #eff6ff;
      border: 1px solid #93c5fd;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }

  .q-status-btn { 
    position: relative;
    transition: background-color 0.1s;
    flex-shrink: 0;
  }
  .status-answered { background-color: #10b981 !important; }
  .status-current { background-color: #facc15 !important; border: 2px solid #2d3748 !important; color: #2d3748 !important; }
  .status-review::before { 
    content: "📌"; 
    position: absolute; top: -6px; right: -6px; 
    font-size: 0.8rem; color: #1c55c8;
    line-height: 1;
    text-shadow: 0 0 2px rgba(0,0,0,0.5);
  }

  /* 解答状況エリアの高さ制限とスクロール設定 */
  #answer-status-scroll-container {
    max-height: 80px; /* 2〜3列分程度に収める */
    overflow-y: auto;
  }

  /* スクロールバーのカスタマイズ (モダンブラウザ用) */
  #answer-status-scroll-container::-webkit-scrollbar {
    width: 6px;
  }
  #answer-status-scroll-container::-webkit-scrollbar-thumb {
    background: #4a5568;
    border-radius: 3px;
  }
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-gray-100">

<!-- ヘッダーバー: 高さを少し抑える -->
<header class="header-bar sticky top-0 z-10 flex justify-between items-center px-4 md:px-8 py-2 bg-white shadow-sm border-b border-gray-200">
    <h1 class="exam-title text-lg md:text-xl font-bold text-gray-800 truncate" th:text="'模擬試験：' + ${exam.examName}">模擬試験名</h1>
    
    <div id="timer-display" class="flex items-center space-x-2 text-lg md:text-xl font-bold text-error-red bg-red-50 px-3 py-1 rounded-full">
        <span>⌛</span>
        <span id="timer" class="font-mono">--:--</span>
    </div>
</header>

<!-- 問題表示エリア (スクロール可能) -->
<main class="question-main flex-grow overflow-y-auto p-4 md:p-6 w-full">
    <div id="question-container" class="max-w-4xl mx-auto">
        <div th:each="q, iterStat : ${examQuestions}" 
             class="question bg-white rounded-xl shadow p-5 md:p-8 mb-6" 
             th:id="'q-'+${q.question.id}" 
             th:data-index="${iterStat.index}"
             th:data-question-id="${q.question.id}">
            
            <div class="question-header flex items-start mb-4 pb-3 border-b border-gray-100">
                <span class="question-number text-xl font-black text-primary-blue mr-3" th:text="'問' + ${iterStat.count}">問1</span>
                <div class="question-text text-base md:text-lg font-semibold text-gray-800 preserve-format" th:utext="${q.question.questionText}">問題文</div>
            </div>

            <div class="choice-group space-y-2">
                <div th:each="c, cStat : ${q.question.choices}" 
                     class="choice cursor-pointer p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition duration-150 flex items-start"
                     th:data-choice-id="${c.id}">
                    <input type="radio" 
                           th:id="'q' + ${q.question.id} + 'c' + ${c.id}" 
                           th:name="'q' + ${q.question.id}" 
                           th:data-question-id="${q.question.id}"
                           th:value="${c.id}"
                           class="choice-radio mt-1 w-5 h-5 text-primary-blue border-gray-300">
                    <label th:for="'q' + ${q.question.id} + 'c' + ${c.id}" 
                           th:utext="${c.choiceText}"
                           class="ml-3 text-gray-700 w-full cursor-pointer">選択肢テキスト</label>
                </div>
            </div>
            
            <div class="review-checkbox-container mt-6 pt-4 border-t border-dashed border-gray-200 flex items-center">
                 <input type="checkbox" th:id="'review-' + ${q.question.id}" class="review-check w-4 h-4 text-primary-blue rounded border-gray-300">
                 <label th:for="'review-' + ${q.question.id}" class="ml-2 text-sm text-gray-500 font-medium cursor-pointer">後で見直す</label>
            </div>
        </div>
    </div>
</main>

<!-- フッター/コントロールパネル: コンパクト化 -->
<footer class="control-panel bg-dark-panel p-3 shadow-2xl flex flex-col md:flex-row items-stretch md:items-center gap-3 w-full">
    
    <!-- 解答状況パネル (スクロール可能) -->
    <div class="flex-grow flex flex-col min-w-0">
        <div id="answer-status-scroll-container" class="flex flex-wrap items-start">
            <div th:each="q, iterStat : ${examQuestions}" 
                 class="q-status-btn w-7 h-7 m-0.5 bg-gray-600 text-white text-xs font-bold rounded flex items-center justify-center cursor-pointer hover:bg-gray-500 transition-colors" 
                 th:data-index="${iterStat.index}"
                 th:text="${iterStat.count}"
                 th:title="'問' + ${iterStat.count}"
                 onclick="showQuestion([[${iterStat.index}]]);"> </div>
        </div>
    </div>

    <!-- 操作エリア -->
    <div class="flex flex-wrap items-center justify-between md:justify-end gap-3 border-t md:border-t-0 border-gray-600 pt-2 md:pt-0">
        <div class="nav-buttons flex gap-2">
            <button id="prev" type="button" class="px-4 py-2 text-sm rounded-lg font-bold text-white bg-gray-600 hover:bg-gray-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
                前へ
            </button>
            <button id="next" type="button" class="px-4 py-2 text-sm rounded-lg font-bold text-white bg-primary-blue hover:bg-primary-blue-hover disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
                次へ
            </button>
        </div>

        <div class="action-buttons flex gap-2">
            <button id="review-list-btn" type="button" class="px-4 py-2 text-sm rounded-lg font-bold text-white bg-accent-yellow hover:bg-yellow-600 text-gray-900 transition-colors">
                一覧
            </button>
            <form th:action="@{/exam/finish}" method="post" id="finishForm" class="m-0">
                <input type="hidden" name="userExamId" id="userExamIdInput" th:value="${userExamId != null ? userExamId : 0}" />
                <input type="hidden" name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" id="finish-exam-btn" class="px-4 py-2 text-sm rounded-lg font-bold text-white bg-error-red hover:bg-red-600 shadow transition-colors">
                    終了
                </button>
            </form>
        </div>
    </div>
</footer>

<script th:inline="javascript">
/*<![CDATA[*/
let duration = /*[[${exam.durationMinutes}]]*/ 60;
let userExamId = /*[[${userExamId}]]*/ 0;
let questionsCount = /*[[${examQuestions.size()}]]*/ 0;
let initialQuestionIndex = /*[[${initialQuestionIndex}]]*/ 0;
let mockExamId = /*[[${exam.id}]]*/ 0;
let existingAnswers = /*[[${existingAnswers}]]*/ []; 

let questionsData = []; 
/*[# th:each="q, iterStat : ${examQuestions}"]*/
questionsData.push({ id: /*[[${q.question.id}]]*/ 0, index: /*[[${iterStat.index}]]*/ 0 });
/*[/]*/

let totalSeconds = duration * 60;
let currentQuestionIndex = 0; 
let timerInterval; 
let answerStatus = {}; 

function updateTimer() {
    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;
    $('#timer').text(String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0'));
    
    if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        $('#finishForm').submit(); 
    } else {
        totalSeconds--;
    }
}

function updateStatusPanel() {
    $('.q-status-btn').each(function(index) {
        let isCurrent = index === currentQuestionIndex;
        let questionId = questionsData[index].id;
        let status = answerStatus[questionId] || { answered: false, review: false };

        $(this).toggleClass('status-current', isCurrent);
        $(this).toggleClass('status-answered', status.answered);
        $(this).toggleClass('status-review', status.review);
        
        // 現在の問題までスクロールを追従させる（オプション）
        if(isCurrent) {
            this.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    });
}

function showQuestion(index) {
    if (index < 0 || index >= questionsCount) return;

    $('.question').hide();
    let targetQuestion = $('#question-container .question').eq(index);
    targetQuestion.show();
    
    currentQuestionIndex = index;
    $('#prev').prop('disabled', currentQuestionIndex === 0);
    $('#next').prop('disabled', currentQuestionIndex === questionsCount - 1);
    
    updateStatusPanel();
    restoreAnswerState(questionsData[index].id);
    
    // 問題切り替え時に一番上までスクロール
    $('.question-main').scrollTop(0);
}

function restoreAnswerState(questionId) {
    let status = answerStatus[questionId] || {};
    $('#q-'+questionId).find('.choice').removeClass('selected');
    $('#q-'+questionId).find('.choice-radio').prop('checked', false);
    
    if (status.answered && status.choiceId != null && status.choiceId > 0) {
        let radio = $('#q'+questionId+'c'+status.choiceId);
        radio.prop('checked', true);
        radio.closest('.choice').addClass('selected');
    }
    $('#review-' + questionId).prop('checked', status.review);
}

function sendAnswerAjax(questionId, choiceId, reviewFlag, isReviewToggle = false) {
    let csrfToken = /*[[${_csrf.token}]]*/ '';
    let csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN'; 
    
    $.ajax({
        url: '/exam/answer',
        type: 'POST',
        data: {
            userExamId: userExamId,
            questionId: questionId,
            choiceId: choiceId, 
            reviewFlag: reviewFlag
        },
        beforeSend: function(xhr) {
            xhr.setRequestHeader(csrfHeader, csrfToken); 
        },
        success: function(){
            let status = answerStatus[questionId] || {};
            let isAnswered = (choiceId != null && choiceId > 0); 
            if (!isReviewToggle) {
                status.answered = isAnswered; 
                status.choiceId = isAnswered ? choiceId : null; 
            }
            status.review = reviewFlag; 
            answerStatus[questionId] = status;
            updateStatusPanel();
        }
    });
}

$(document).on('change', '.choice-radio', function() {
    let questionId = $(this).data('question-id');
    let choiceId = $(this).val(); 
    let reviewChecked = $('#review-' + questionId).is(':checked');
    $('#q-'+questionId).find('.choice').removeClass('selected');
    $(this).closest('.choice').addClass('selected');
    sendAnswerAjax(questionId, choiceId, reviewChecked);
});

$(document).on('change', '.review-check', function() {
    let questionId = $(this).closest('.question').data('question-id');
    let reviewFlag = $(this).is(':checked');
    let selectedChoiceId = $('#q-'+questionId).find('.choice-radio:checked').val() || null;
    sendAnswerAjax(questionId, selectedChoiceId, reviewFlag, true);
});

$('#prev').click(function() { showQuestion(currentQuestionIndex - 1); });
$('#next').click(function() { showQuestion(currentQuestionIndex + 1); });

$('#review-list-btn').click(function() {
    if (mockExamId > 0) window.location.href = '/exam/review/' + mockExamId;
});

function initializeAnswerStatus(answerDtos) {
    answerDtos.forEach(function(answerDto) {
        let questionId = answerDto.questionId; 
        let selectedChoiceId = answerDto.selectedChoiceId;
        let answered = (selectedChoiceId != null && selectedChoiceId > 0); 
        if (questionId) {
             answerStatus[questionId] = { 
                answered: answered, 
                review: answerDto.reviewFlag,
                choiceId: selectedChoiceId
            };
        }
    });
}

$(document).ready(function() {
    initializeAnswerStatus(existingAnswers); 
    if (totalSeconds > 0) {
        updateTimer(); 
        timerInterval = setInterval(updateTimer, 1000);
    }
    if (questionsCount > 0) {
        showQuestion(initialQuestionIndex); 
    } else {
        $('#question-container').html('<p class="text-center text-lg p-8 text-gray-600">問題がありません。</p>');
    }
    hljs.highlightAll();
});
/*]]>*/
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
</body>
</html>
