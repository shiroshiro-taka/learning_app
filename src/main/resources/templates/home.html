<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - 学習支援システム</title>
    <!-- Tailwind CSS CDNを読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
     <script th:src="@{/js/tailwind-config.js}"></script>
	<style>
	    .preserve-format {
	        white-space: pre-wrap;
	    }
	    .menu-link-card {
	        transition: transform 0.2s, box-shadow 0.2s;
	    }
	    .menu-link-card:hover {
	        transform: translateY(-3px);
	        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
	    }
	</style>
</head>
<body class="bg-gray-50 font-sans">
    
    <!-- ヘッダー/ナビゲーションバー -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2 sm:py-3 flex justify-between items-center">
            <!-- システムタイトル（スマホではサイズを抑える） -->
            <div class="text-lg sm:text-2xl font-bold text-gray-900 truncate mr-2">
                学習支援システム
            </div>
            
			<div class="flex items-center space-x-2 sm:space-x-4 shrink-0">
				<!-- 学習カレンダーボタン（スマホではアイコンのみ、PCではテキストあり） -->
				<a th:href="@{/scores/calendar}" 
				     class="inline-flex items-center justify-center p-2 sm:px-3 sm:py-2 text-sm font-medium rounded-lg text-primary-blue border border-primary-blue hover:bg-blue-50 transition duration-150 shadow-sm"
                     title="学習カレンダー">
					 <!-- アイコンが消えないよう、style属性で強制的に色を指定 -->
					 <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-5 sm:w-5 sm:mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="stroke: #1c55c8; display: block;">
					    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
				     </svg>
				     <span class="hidden sm:inline ml-1">学習カレンダー</span>
				 </a>
							
				 <!-- ログアウトフォーム -->
				 <form th:action="@{/logout}" method="post">
				     <button 
				     type="submit"
				     class="px-3 py-2 text-sm font-medium rounded-lg text-white bg-red-600 hover:bg-red-700 transition duration-150 shadow-md">
				     ログアウト
				     </button>
				  </form>
			</div>
        </div>
    </nav>

    <!-- メインコンテンツエリア -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-12">
        
        <!-- ユーザー挨拶とコメントのカード -->
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg mb-8">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 mb-2">
                ようこそ、<span th:text="${username}" class="text-primary-blue">User</span> さん！
            </h2>
			<p class="mt-4 text-base sm:text-lg font-medium text-gray-600 leading-relaxed">
				Java資格であるOCJP Silverの合格を目指すための学習支援システムです。
			</p>
            <p class="preserve-format mt-4 text-gray-700 border-t pt-4" th:if="${homeComment != null}" th:text="${homeComment}"></p>
        </div>
        
        <!-- 学習メニューセクション -->
        <section class="mb-12">
            <h3 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6 border-b-2 border-primary-blue pb-2">学習メニュー</h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
                <!-- 分野別問題演習 -->
                <a th:href="@{/play/select}" class="menu-link-card block bg-white p-5 sm:p-6 rounded-xl shadow-md border-l-4 border-accent-green hover:border-primary-blue">
                    <p class="text-lg sm:text-xl font-semibold text-gray-900">分野別問題演習</p>
                    <p class="text-sm text-gray-500 mt-1">特定の分野を選んで学習します。</p>
                </a>

                <!-- ランダム出題 -->
                <a th:href="@{/play/random}" class="menu-link-card block bg-white p-5 sm:p-6 rounded-xl shadow-md border-l-4 border-accent-green hover:border-primary-blue">
                    <p class="text-lg sm:text-xl font-semibold text-gray-900">ランダム出題</p>
                    <p class="text-sm text-gray-500 mt-1">全範囲から挑戦します。</p>
                </a>

                <!-- 模擬試験 -->
                <a th:href="@{/exam/list}" class="menu-link-card block bg-white p-5 sm:p-6 rounded-xl shadow-md border-l-4 border-accent-green hover:border-primary-blue">
                    <p class="text-lg sm:text-xl font-semibold text-gray-900">模擬試験</p>
                    <p class="text-sm text-gray-500 mt-1">本番形式で実力を試します。</p>
                </a>
                
                <!-- 苦手問題に再挑戦 -->
                <a th:href="@{/play/weak}" class="menu-link-card block bg-white p-5 sm:p-6 rounded-xl shadow-md border-l-4 border-accent-green hover:border-primary-blue">
                    <p class="text-lg sm:text-xl font-semibold text-gray-900">苦手問題に再挑戦</p>
                    <p class="text-sm text-gray-500 mt-1">間違えた問題を克服します。</p>
                </a>
                
                <!-- 学習進捗・成績確認 -->
                <a th:href="@{/scores/result}" class="menu-link-card block bg-white p-5 sm:p-6 rounded-xl shadow-md border-l-4 border-accent-green hover:border-primary-blue">
                    <p class="text-lg sm:text-xl font-semibold text-gray-900">学習進捗・成績確認</p>
                    <p class="text-sm text-gray-500 mt-1">成績データを確認します。</p>
                </a>
                
                <!-- Java実行環境 -->
				<a href="https://dokojava.jp/sources/Main.java/" target="_blank" class="menu-link-card block bg-white p-5 sm:p-6 rounded-xl shadow-md border-l-4 border-accent-green hover:border-primary-blue">
                    <p class="text-lg sm:text-xl font-semibold text-gray-900">Java実行環境</p>
                    <p class="text-sm text-gray-500 mt-1">コードを試行・実行できます。</p>
                </a>
            </div>
            
            <!-- お問い合わせリンク -->
            <div class="mt-8 text-center">
                 <a th:if="${#authorization.expression('hasRole(''USER'')')}" 
                    th:href="@{/inquiry/form}"
                    class="inline-flex items-center justify-center w-full sm:w-auto px-8 py-3 border border-transparent text-base font-medium rounded-lg shadow-md text-white bg-primary-blue hover:bg-primary-blue-hover transition duration-150"
                 >
                    お問い合わせ
                </a>
            </div>
        </section>


        <!-- 管理者メニュー -->
        <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="mt-12 pt-6 border-t-2 border-gray-200">
            <h3 class="text-xl sm:text-2xl font-bold text-red-600 mb-6">管理者メニュー</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <a href="/admin/categories" class="menu-link-card block bg-white p-4 rounded-lg shadow-md border-l-4 border-red-500 hover:border-red-700">
                    <p class="text-lg font-medium text-gray-900">分野管理</p>
                </a>
                <a href="/admin/questions" class="menu-link-card block bg-white p-4 rounded-lg shadow-md border-l-4 border-red-500 hover:border-red-700">
                    <p class="text-lg font-medium text-gray-900">問題管理</p>
                </a>
                <a href="/admin/mock_exam/list" class="menu-link-card block bg-white p-4 rounded-lg shadow-md border-l-4 border-red-500 hover:border-red-700">
                    <p class="text-lg font-medium text-gray-900">模擬試験管理</p>
                </a>
                <a href="/admin/users" class="menu-link-card block bg-white p-4 rounded-lg shadow-md border-l-4 border-red-500 hover:border-red-700">
                    <p class="text-lg font-medium text-gray-900">ユーザー管理</p>
                </a>
                <a th:href="@{/admin/home-comment}" class="menu-link-card block bg-white p-4 rounded-lg shadow-md border-l-4 border-red-500 hover:border-red-700">
                    <p class="text-lg font-medium text-gray-900">ホームコメント編集</p>
                </a>
                <a th:href="@{/admin/inquiries}" class="menu-link-card block bg-white p-4 rounded-lg shadow-md border-l-4 border-red-500 hover:border-red-700">
                    <p class="text-lg font-medium text-gray-900">お問い合わせ一覧</p>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
