<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習カレンダー | Java Silver学習アプリ</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- 外部CSSの読み込み -->
    <link rel="stylesheet" th:href="@{/css/auth-login.css}">
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 gap-3">
                <div>
                    <div class="d-flex align-items-baseline gap-3">
                        <h1 class="h3 mb-0 fw-bold" th:text="${currentMonthName}">2026年 4月</h1>
                        <span class="h4 mb-0 text-muted fw-normal">学習カレンダー</span>
                    </div>
                    <div class="d-flex align-items-center mt-2">
                        <span class="text-muted small me-2">学習量:</span>
                        <div class="legend-item"><div class="legend-color level-0"></div><span>0問</span></div>
                        <div class="legend-item"><div class="legend-color level-1"></div><span>1問以上</span></div>
                        <div class="legend-item"><div class="legend-color level-2"></div><span>10問以上</span></div>
                        <div class="legend-item"><div class="legend-color level-3"></div><span>20問以上</span></div>
                        <div class="legend-item"><div class="legend-color level-4"></div><span>50問以上</span></div>
                    </div>
                </div>
                <div class="btn-group shadow-sm">
                    <a th:href="@{/scores/calendar(month=${prevMonth})}" class="btn btn-white border bg-white"><i class="material-icons align-middle">chevron_left</i></a>
                    <a th:href="@{/scores/calendar(month=${nextMonth})}" class="btn btn-white border bg-white"><i class="material-icons align-middle">chevron_right</i></a>
                </div>
            </div>

            <div class="card calendar-card shadow mb-5">
                <div class="calendar-grid">
                    <div th:each="name, stat : ${dayOfWeekNames}" class="calendar-header-cell" th:classappend="${stat.index == 0 ? 'sun' : (stat.index == 6 ? 'sat' : '')}">
                        <span th:text="${name}">月</span>
                    </div>

                    <div th:each="pad : ${paddingDays}" class="calendar-day-cell prev-month-day"></div>

                    <div th:each="day, stat : ${calendarDays}" 
                         class="calendar-day-cell clickable-day"
                         th:attr="data-date=${day.date}"
                         th:classappend="${day.answerCount >= 50 ? 'level-4' : (day.answerCount >= 20 ? 'level-3' : (day.answerCount >= 10 ? 'level-2' : (day.answerCount >= 1 ? 'level-1' : 'level-0')))}">
                        
                        <div class="day-num" th:text="${day.dayOfMonth}"
                             th:classappend="${(paddingDays.size() + stat.index) % 7 == 0 ? 'sun' : ((paddingDays.size() + stat.index + 1) % 7 == 0 ? 'sat' : '')}">
                        </div>

                        <div th:if="${day.answerCount > 0}">
                            <div class="study-log">
                                <span th:text="${day.answerCount} + '問'">0問</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="detail-area" class="d-none">
                <div class="card shadow-sm p-4 bg-white" style="border-radius: 15px;">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                        <div>
                            <h4 id="detail-date" class="fw-bold mb-0 text-dark">-</h4>
                        </div>
                        <i class="material-icons text-primary fs-1">event_available</i>
                    </div>

                    <div class="row text-center g-3 mb-4">
                        <div class="col-md-4">
                            <div class="p-3 border rounded-3 bg-light">
                                <div class="text-muted small mb-1">総回答数</div>
                                <div id="detail-total" class="h3 mb-0 fw-bold">-</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 border rounded-3 bg-light">
                                <div class="text-muted small mb-1">正答数</div>
                                <div id="detail-correct" class="h3 mb-0 fw-bold text-success">-</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 border rounded-3 bg-light">
                                <div class="text-muted small mb-1">正答率</div>
                                <div id="detail-accuracy" class="h3 mb-0 fw-bold text-primary">-</div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-2">
                        <h5 class="fw-bold mb-3 d-flex align-items-center">
                            <i class="material-icons me-2 text-warning">assignment</i>模擬試験の結果
                        </h5>
                        <div id="mock-exam-list" class="list-group list-group-flush border-top"></div>
                    </div>
                </div>
            </div>

            <div class="mt-5 text-center">
                <a th:href="@{/home}" class="btn btn-outline-secondary px-4 rounded-pill">
                    <i class="material-icons align-middle me-1">home</i> ホームへ戻る
                </a>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const days = document.querySelectorAll('.clickable-day');
        
        /** * 修正箇所:
         * toISOString() を使用せず、Intl.DateTimeFormat で日本時間の yyyy-mm-dd を取得します。
         * これにより深夜0時〜9時の間の判定ズレを防ぎます。
         */
        const todayStr = new Intl.DateTimeFormat('sv-SE', { 
            timeZone: 'Asia/Tokyo' 
        }).format(new Date()); 

        let initialCell = null;

        days.forEach(day => {
            const dateStr = day.getAttribute('data-date');

            if (dateStr === todayStr) {
                day.classList.add('is-today');
                initialCell = day;
            }

            day.addEventListener('click', function() {
                days.forEach(d => d.classList.remove('selected-day'));
                this.classList.add('selected-day');
                const date = this.getAttribute('data-date');
                if (date) loadDailyDetail(date);
            });
        });

        if (initialCell) {
            initialCell.click();
        } else if (days.length > 0) {
            days[0].click();
        }
    });

    function loadDailyDetail(dateStr) {
        const detailArea = document.getElementById('detail-area');
        const apiUrl = /*[[@{/api/scores/daily}]]*/ '/api/scores/daily';

        fetch(`${apiUrl}?date=${dateStr}`)
            .then(response => response.json())
            .then(data => {
                detailArea.classList.remove('d-none');
                document.getElementById('detail-date').innerText = data.formattedDate || dateStr;
                document.getElementById('detail-total').innerText = (data.totalCount || 0) + ' 問';
                document.getElementById('detail-correct').innerText = (data.correctCount || 0) + ' 問';
                document.getElementById('detail-accuracy').innerText = (data.accuracy || 0).toFixed(1) + ' %';

                const mockListContainer = document.getElementById('mock-exam-list');
                mockListContainer.innerHTML = ''; 

                if (data.mockExams && data.mockExams.length > 0) {
                    data.mockExams.forEach(exam => {
                        const statusText = exam.passed ? '合格' : '不合格';
                        const statusClass = exam.passed ? 'badge-pass' : 'badge-fail';
                        const item = `
                            <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                                <div>
                                    <span class="fw-bold text-secondary">${exam.name}</span>
                                    <span class="badge ${statusClass} ms-2">${statusText}</span>
                                </div>
                                <div class="badge bg-light text-dark border rounded-pill px-3">${exam.score} / ${exam.totalQuestions} 問</div>
                            </div>`;
                        mockListContainer.insertAdjacentHTML('beforeend', item);
                    });
                } else {
                    mockListContainer.innerHTML = '<p class="text-muted py-4 mb-0 text-center small">この日の模擬試験データはありません。</p>';
                }
                
                detailArea.classList.add('show');
            });
    }
</script>
</body>
</html>
