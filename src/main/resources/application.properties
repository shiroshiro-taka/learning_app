spring.application.name=learning_app

## --- DB接続設定 ---
## ここは変数名の指定だけでOKです
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
# 下記の設定も追記しておくと接続が安定します
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- タイムゾーン設定の追加 ---
# Hibernateが時刻を保存・取得する際のタイムゾーン
 spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# Jackson（JSON変換）を使用している場合のタイムゾーン
 spring.jackson.time-zone=Asia/Tokyo



